
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-sonarqube-demo-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: \"true\"
    nginx.ingress.kubernetes.io/canary-weight: \"50\"
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: python-sonarqube-demo-canary
            port:
              number: 80
