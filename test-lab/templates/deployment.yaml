apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-sonarqube-demo
  labels:
    app: python-sonarqube-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      
      maxSurge: 1
  selector:
    matchLabels:
      app: python-sonarqube-demo
  template:
    metadata:
      labels:
        app: python-sonarqube-demo
    spec:
      containers:
        - name: app
    
          image: "{{ .Values.backend.image.repository}}:{{ .Values.backend.image.tag}}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001            # UID créé dans le Dockerfile (appuser)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp           # gunicorn écrit ses fichiers temporaires ici
      volumes:
        - name: tmp
          emptyDir: {}